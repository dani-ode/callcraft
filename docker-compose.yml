version: '3.8'

services:
  callcraft-postgres:
    image: postgres:16-alpine
    container_name: callcraft-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - callcraft-network

  callcraft-redis:
    image: redis:7-alpine
    container_name: callcraft-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - callcraft-network

  callcraft-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: callcraft-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required in .env}
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@callcraft-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@callcraft-redis:6379
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required in .env}
      - SERVICE_CLIENT_SECRET=${SERVICE_CLIENT_SECRET:?SERVICE_CLIENT_SECRET is required in .env}
    depends_on:
      - callcraft-postgres
      - callcraft-redis
    networks:
      - callcraft-network

  callcraft-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: callcraft-worker
    restart: always
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV is required in .env}
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@callcraft-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@callcraft-redis:6379
    depends_on:
      - callcraft-postgres
      - callcraft-redis
    networks:
      - callcraft-network

  callcraft-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: callcraft-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required in .env}
      - SERVICE_CLIENT_ID=${SERVICE_CLIENT_ID:?SERVICE_CLIENT_ID is required in .env}
      - SERVICE_CLIENT_SECRET=${SERVICE_CLIENT_SECRET:?SERVICE_CLIENT_SECRET is required in .env}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required in .env}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required in .env}
    depends_on:
      - callcraft-api
    networks:
      - callcraft-network

networks:
  callcraft-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
