[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "callcraft"
version = "0.1.0"
description = "Callcraft — AI-Powered Dynamic Multimodal API Execution Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "cryptography>=42.0.7",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.1",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
where = ["apps/api/src", "apps/worker"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["apps/api", "apps/api/src", "apps/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests"]
pythonpath = ["apps/api", "apps/api/src", "apps/worker"]
